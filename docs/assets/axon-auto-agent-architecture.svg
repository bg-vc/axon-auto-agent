<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Axon Auto Agent architecture</title>
  <desc id="desc">A decoupled stack from the Axon Auto Agent desktop GUI through its autonomy kernel, DeepSeek Harness, plugins, and execution providers.</desc>
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#1b1b1b" opacity="0.11"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#281d14" flood-opacity="0.13"/></filter>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
      .h{font-size:25px;font-weight:850;fill:#171717}
      .b{font-size:18px;font-weight:560;fill:#514b44}
      .chip{font-size:15px;font-weight:720;fill:#292622}
    </style>
  </defs>
  <rect width="1600" height="1040" fill="#f7f0e5"/><rect width="1600" height="1040" fill="url(#dots)"/>
  <text x="800" y="80" text-anchor="middle" class="sans" font-size="47" font-weight="900" letter-spacing="2" fill="#111">ONE CORE, MANY CAPABILITIES</text>
  <text x="800" y="119" text-anchor="middle" class="sans" font-size="20" font-weight="620" fill="#625b53">A clear GUI on top. Replaceable models, tools, plugins, and execution environments underneath.</text>

  <g filter="url(#shadow)">
    <rect x="160" y="175" width="1120" height="126" rx="24" fill="#fffaf2" stroke="#171717" stroke-width="2"/>
    <rect x="160" y="341" width="1120" height="144" rx="24" fill="#ff3b18" stroke="#171717" stroke-width="2"/>
    <rect x="160" y="525" width="1120" height="144" rx="24" fill="#171717" stroke="#171717" stroke-width="2"/>
    <rect x="160" y="709" width="1120" height="126" rx="24" fill="#fffaf2" stroke="#171717" stroke-width="2"/>
    <rect x="160" y="875" width="1120" height="112" rx="24" fill="#ede2d2" stroke="#171717" stroke-width="2"/>
  </g>

  <rect x="185" y="197" width="170" height="80" rx="17" fill="#171717"/><text x="270" y="231" text-anchor="middle" class="sans" font-size="14" font-weight="800" letter-spacing="2" fill="#ff6a4b">EXPERIENCE</text><text x="270" y="258" text-anchor="middle" class="sans" font-size="20" font-weight="820" fill="#fff7ed">DESKTOP GUI</text>
  <text x="390" y="221" class="sans h">Goal brief · Live canvas · Decisions · Artifacts · History</text>
  <text x="390" y="258" class="sans b">Human-readable projections; raw trajectories stay available as diagnostics.</text>

  <rect x="185" y="369" width="170" height="88" rx="17" fill="#fff8ee"/><text x="270" y="403" text-anchor="middle" class="sans" font-size="13" font-weight="850" letter-spacing="1" fill="#a6210c">AUTONOMY CORE</text><text x="270" y="431" text-anchor="middle" class="sans" font-size="14" font-weight="850" fill="#171717">AXON AUTO AGENT</text>
  <text x="390" y="391" class="sans h">Goals · Evaluation · Budgets · Checkpoints</text>
  <text x="390" y="430" class="sans" font-size="18" font-weight="650" fill="#42150d">Owns when work may continue, must pause, should roll back, or is truly complete.</text>
  <g class="sans chip"><rect x="390" y="447" width="130" height="27" rx="13" fill="#fff8ee" opacity="0.94"/><text x="455" y="466" text-anchor="middle">MODEL-NEUTRAL</text><rect x="534" y="447" width="123" height="27" rx="13" fill="#fff8ee" opacity="0.94"/><text x="596" y="466" text-anchor="middle">UI-NEUTRAL</text><rect x="671" y="447" width="128" height="27" rx="13" fill="#fff8ee" opacity="0.94"/><text x="735" y="466" text-anchor="middle">REPLAYABLE</text></g>

  <rect x="185" y="553" width="170" height="88" rx="17" fill="#ff3b18"/><text x="270" y="587" text-anchor="middle" class="sans" font-size="14" font-weight="850" letter-spacing="2" fill="#2a0903">RUNTIME</text><text x="270" y="615" text-anchor="middle" class="sans" font-size="19" font-weight="850" fill="#fff7ed">DSH + CORDIS</text>
  <text x="390" y="575" class="sans" font-size="25" font-weight="850" fill="#fff8ee">Sessions · Agent loop · Tools · Jobs · Workflows · Subagents</text>
  <text x="390" y="614" class="sans" font-size="18" font-weight="620" fill="#c9c0b7">Event-driven plugin composition, model adapters, policy enforcement, sandbox, persistence.</text>
  <text x="390" y="646" class="mono" font-size="15" fill="#ff856d">UPSTREAM DEPENDENCY · PINNED · TESTED · NOT FORKED</text>

  <rect x="185" y="732" width="170" height="80" rx="17" fill="#171717"/><text x="270" y="766" text-anchor="middle" class="sans" font-size="14" font-weight="800" letter-spacing="2" fill="#ff6a4b">CAPABILITIES</text><text x="270" y="793" text-anchor="middle" class="sans" font-size="20" font-weight="820" fill="#fff7ed">PLUGINS</text>
  <text x="390" y="755" class="sans h">Domain tools · Evaluators · Renderers · Providers</text>
  <text x="390" y="792" class="sans b">Replace one capability without rewriting the loop, desktop shell, or domain logic.</text>

  <rect x="185" y="895" width="170" height="72" rx="17" fill="#ff3b18"/><text x="270" y="923" text-anchor="middle" class="sans" font-size="13" font-weight="850" letter-spacing="2" fill="#2a0903">EXECUTION</text><text x="270" y="950" text-anchor="middle" class="sans" font-size="18" font-weight="850" fill="#fff7ed">PROVIDERS</text>
  <text x="390" y="918" class="sans h">Local · Sandbox · Remote · Browser · API · GPU · Instrument</text>
  <text x="390" y="954" class="sans b">Portable workspaces and structured receipts keep execution worlds interchangeable.</text>

  <g fill="none" stroke="#ff3b18" stroke-width="4"><path d="M720 301v30"/><path d="M720 485v30"/><path d="M720 669v30"/><path d="M720 835v30"/></g>
  <g fill="#ff3b18"><path d="M709 326l11 15 11-15z"/><path d="M709 510l11 15 11-15z"/><path d="M709 694l11 15 11-15z"/><path d="M709 860l11 15 11-15z"/></g>

  <rect x="1325" y="175" width="126" height="812" rx="24" fill="#fffaf2" stroke="#171717" stroke-width="2"/>
  <path d="M1354 239v665" stroke="#ff3b18" stroke-width="5"/><path d="M1342 253l12-17 12 17M1342 890l12 17 12-17" fill="none" stroke="#ff3b18" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1414" y="528" transform="rotate(-90 1414 528)" text-anchor="middle" class="sans" font-size="18" font-weight="850" letter-spacing="3" fill="#171717">DURABLE EVENTS · TYPED RESULTS · POLICY</text>
</svg>
