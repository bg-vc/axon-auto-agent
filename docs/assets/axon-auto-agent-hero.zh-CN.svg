<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Axon Auto Agent</title>
  <desc id="desc">把目标转化为可验证工作与产物的 GUI 优先自主任务工作台。</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#151515" stroke-opacity="0.055" stroke-width="1"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#251a12" flood-opacity="0.12"/></filter>
    <style>
      .sans{font-family:Inter,"PingFang SC","Microsoft YaHei",ui-sans-serif,system-ui,sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,"PingFang SC",monospace}
      .label{font-size:17px;font-weight:750;letter-spacing:2px;fill:#6e675e}
      .body{font-size:22px;font-weight:650;fill:#181715}
      .small{font-size:17px;font-weight:550;fill:#5b554e}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f7f0e5"/><rect width="1600" height="900" fill="url(#grid)"/>
  <path d="M52 104V52h52M1496 52h52v52M52 796v52h52M1496 848h52v-52" fill="none" stroke="#171717" stroke-width="2"/>
  <circle cx="52" cy="52" r="8" fill="#ff3b18"/><circle cx="1548" cy="848" r="8" fill="#ff3b18"/>
  <text x="800" y="122" text-anchor="middle" class="sans" font-size="78" font-weight="900" letter-spacing="5" fill="#111111">AXON AUTO AGENT</text>
  <text x="800" y="177" text-anchor="middle" class="sans" font-size="24" font-weight="750" letter-spacing="7" fill="#ff3b18">AUTONOMY</text>
  <text x="800" y="220" text-anchor="middle" class="sans" font-size="24" font-weight="620" fill="#292622">只描述结果，Agent 负责规划、执行、验证并持续推进。</text>
  <g filter="url(#shadow)"><rect x="82" y="310" width="350" height="300" rx="26" fill="#fffaf2" stroke="#1b1a18" stroke-width="2"/><rect x="625" y="282" width="350" height="356" rx="30" fill="#171717" stroke="#171717" stroke-width="2"/><rect x="1168" y="310" width="350" height="300" rx="26" fill="#fffaf2" stroke="#1b1a18" stroke-width="2"/></g>
  <text x="118" y="357" class="sans label">你的目标</text>
  <rect x="118" y="390" width="278" height="48" rx="12" fill="#f1e7d9"/><circle cx="141" cy="414" r="7" fill="#ff3b18"/>
  <text x="160" y="421" class="sans body">最后要得到什么？</text>
  <line x1="118" y1="475" x2="386" y2="475" stroke="#c7bdae" stroke-width="2"/>
  <text x="118" y="510" class="sans small">上下文 · 边界</text><text x="118" y="542" class="sans small">预算 · 限制</text><text x="118" y="574" class="sans small">结果 · 证据</text>
  <text x="800" y="338" text-anchor="middle" class="sans" font-size="16" font-weight="800" letter-spacing="2" fill="#ff6a4b">AXON AUTO AGENT 自主循环</text>
  <circle cx="800" cy="454" r="68" fill="none" stroke="#ff3b18" stroke-width="4"/><circle cx="800" cy="454" r="17" fill="#ff3b18"/>
  <path d="M800 386A68 68 0 0 1 868 454" fill="none" stroke="#fff8ee" stroke-width="9" stroke-linecap="round"/><path d="M857 437l13 17-19 9" fill="none" stroke="#fff8ee" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="800" y="557" text-anchor="middle" class="sans" font-size="21" font-weight="700" fill="#fff8ee">规划 → 执行 → 验证</text><text x="800" y="592" text-anchor="middle" class="mono" font-size="16" fill="#aaa39a">检查点 · 学习 · 恢复</text>
  <text x="1204" y="357" class="sans label">证据与产物</text>
  <rect x="1204" y="389" width="278" height="124" rx="16" fill="#171717"/><rect x="1228" y="413" width="108" height="76" rx="8" fill="#ff3b18"/><path d="M1248 469l26-27 18 18 13-12 15 21z" fill="#fff5e9"/><rect x="1358" y="416" width="98" height="10" rx="5" fill="#fff5e9"/><rect x="1358" y="442" width="80" height="8" rx="4" fill="#77716a"/><rect x="1358" y="466" width="92" height="8" rx="4" fill="#77716a"/>
  <text x="1204" y="551" class="sans small">预览 · 来源</text><text x="1204" y="583" class="sans small">评估 · 版本</text>
  <path d="M432 460H604" fill="none" stroke="#ff3b18" stroke-width="4"/><path d="M585 447l19 13-19 13" fill="none" stroke="#ff3b18" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M975 460h172" fill="none" stroke="#ff3b18" stroke-width="4"/><path d="M1128 447l19 13-19 13" fill="none" stroke="#ff3b18" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g class="sans"><rect x="130" y="715" width="250" height="74" rx="18" fill="#fffaf2" stroke="#1b1a18" stroke-width="2"/><rect x="493" y="715" width="250" height="74" rx="18" fill="#fffaf2" stroke="#1b1a18" stroke-width="2"/><rect x="856" y="715" width="250" height="74" rx="18" fill="#fffaf2" stroke="#1b1a18" stroke-width="2"/><rect x="1219" y="715" width="250" height="74" rx="18" fill="#fffaf2" stroke="#1b1a18" stroke-width="2"/><text x="255" y="759" text-anchor="middle" font-size="19" font-weight="750" fill="#171717">GUI 优先</text><text x="618" y="759" text-anchor="middle" font-size="19" font-weight="750" fill="#171717">一切可插拔</text><text x="981" y="759" text-anchor="middle" font-size="19" font-weight="750" fill="#171717">事件可回放</text><text x="1344" y="759" text-anchor="middle" font-size="19" font-weight="750" fill="#171717">自主执行，边界可控</text></g>
</svg>
