<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Axon Auto Agent 架构</title>
  <desc id="desc">从 Axon Auto Agent 桌面 GUI、自主内核、DeepSeek Harness、插件到执行环境的解耦架构。</desc>
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#1b1b1b" opacity="0.11"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#281d14" flood-opacity="0.13"/></filter>
    <style>
      .sans{font-family:Inter,"PingFang SC","Microsoft YaHei",ui-sans-serif,system-ui,sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,"PingFang SC",monospace}
      .h{font-size:25px;font-weight:850;fill:#171717}
      .b{font-size:18px;font-weight:560;fill:#514b44}
      .chip{font-size:15px;font-weight:720;fill:#292622}
    </style>
  </defs>
  <rect width="1600" height="1040" fill="#f7f0e5"/><rect width="1600" height="1040" fill="url(#dots)"/>
  <text x="800" y="80" text-anchor="middle" class="sans" font-size="47" font-weight="900" letter-spacing="2" fill="#111">一套内核，连接不同能力</text>
  <text x="800" y="119" text-anchor="middle" class="sans" font-size="20" font-weight="620" fill="#625b53">上层是清晰易用的 GUI，底层模型、工具、插件和执行环境都可以替换</text>
  <g filter="url(#shadow)"><rect x="160" y="175" width="1120" height="126" rx="24" fill="#fffaf2" stroke="#171717" stroke-width="2"/><rect x="160" y="341" width="1120" height="144" rx="24" fill="#ff3b18" stroke="#171717" stroke-width="2"/><rect x="160" y="525" width="1120" height="144" rx="24" fill="#171717" stroke="#171717" stroke-width="2"/><rect x="160" y="709" width="1120" height="126" rx="24" fill="#fffaf2" stroke="#171717" stroke-width="2"/><rect x="160" y="875" width="1120" height="112" rx="24" fill="#ede2d2" stroke="#171717" stroke-width="2"/></g>
  <rect x="185" y="197" width="170" height="80" rx="17" fill="#171717"/><text x="270" y="231" text-anchor="middle" class="sans" font-size="14" font-weight="800" letter-spacing="2" fill="#ff6a4b">体验层</text><text x="270" y="258" text-anchor="middle" class="sans" font-size="20" font-weight="820" fill="#fff7ed">桌面 GUI</text><text x="390" y="221" class="sans h">目标简报 · 实时画布 · 决策 · 产物 · 历史</text><text x="390" y="258" class="sans b">用业务语言呈现状态，原始轨迹只作为可展开诊断信息。</text>
  <rect x="185" y="369" width="170" height="88" rx="17" fill="#fff8ee"/><text x="270" y="403" text-anchor="middle" class="sans" font-size="14" font-weight="850" letter-spacing="2" fill="#a6210c">自主内核</text><text x="270" y="431" text-anchor="middle" class="sans" font-size="14" font-weight="850" fill="#171717">AXON AUTO AGENT</text><text x="390" y="391" class="sans h">目标 · 评估 · 预算 · 检查点</text><text x="390" y="430" class="sans" font-size="18" font-weight="650" fill="#42150d">决定何时继续、暂停、回滚，以及何时真正完成。</text>
  <g class="sans chip"><rect x="390" y="447" width="110" height="27" rx="13" fill="#fff8ee" opacity="0.94"/><text x="445" y="466" text-anchor="middle">模型中立</text><rect x="514" y="447" width="100" height="27" rx="13" fill="#fff8ee" opacity="0.94"/><text x="564" y="466" text-anchor="middle">UI 中立</text><rect x="628" y="447" width="110" height="27" rx="13" fill="#fff8ee" opacity="0.94"/><text x="683" y="466" text-anchor="middle">状态可回放</text></g>
  <rect x="185" y="553" width="170" height="88" rx="17" fill="#ff3b18"/><text x="270" y="587" text-anchor="middle" class="sans" font-size="14" font-weight="850" letter-spacing="2" fill="#2a0903">运行底座</text><text x="270" y="615" text-anchor="middle" class="sans" font-size="19" font-weight="850" fill="#fff7ed">DSH + CORDIS</text><text x="390" y="575" class="sans" font-size="25" font-weight="850" fill="#fff8ee">Session · Agent Loop · 工具 · Job · Workflow · Subagent</text><text x="390" y="614" class="sans" font-size="18" font-weight="620" fill="#c9c0b7">事件驱动插件组合、模型适配、策略约束、沙箱与持久化。</text><text x="390" y="646" class="mono" font-size="15" fill="#ff856d">上游依赖 · 固定版本 · 持续测试 · 不维护私有 FORK</text>
  <rect x="185" y="732" width="170" height="80" rx="17" fill="#171717"/><text x="270" y="766" text-anchor="middle" class="sans" font-size="14" font-weight="800" letter-spacing="2" fill="#ff6a4b">能力层</text><text x="270" y="793" text-anchor="middle" class="sans" font-size="20" font-weight="820" fill="#fff7ed">插件</text><text x="390" y="755" class="sans h">领域工具 · 验证器 · 渲染器 · Provider</text><text x="390" y="792" class="sans b">替换一种能力，不重写全局循环、桌面外壳或领域逻辑。</text>
  <rect x="185" y="895" width="170" height="72" rx="17" fill="#ff3b18"/><text x="270" y="923" text-anchor="middle" class="sans" font-size="13" font-weight="850" letter-spacing="2" fill="#2a0903">执行层</text><text x="270" y="950" text-anchor="middle" class="sans" font-size="18" font-weight="850" fill="#fff7ed">执行环境</text><text x="390" y="918" class="sans h">本地 · 沙箱 · 远程 · 浏览器 · API · GPU · 仪器</text><text x="390" y="954" class="sans b">通过可迁移工作区和结构化回执，让执行世界可以替换。</text>
  <g fill="none" stroke="#ff3b18" stroke-width="4"><path d="M720 301v30"/><path d="M720 485v30"/><path d="M720 669v30"/><path d="M720 835v30"/></g><g fill="#ff3b18"><path d="M709 326l11 15 11-15z"/><path d="M709 510l11 15 11-15z"/><path d="M709 694l11 15 11-15z"/><path d="M709 860l11 15 11-15z"/></g>
  <rect x="1325" y="175" width="126" height="812" rx="24" fill="#fffaf2" stroke="#171717" stroke-width="2"/><path d="M1354 239v665" stroke="#ff3b18" stroke-width="5"/><path d="M1342 253l12-17 12 17M1342 890l12 17 12-17" fill="none" stroke="#ff3b18" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="1414" y="528" transform="rotate(-90 1414 528)" text-anchor="middle" class="sans" font-size="18" font-weight="850" letter-spacing="3" fill="#171717">持久事件 · 类型化结果 · 权限策略</text>
</svg>
